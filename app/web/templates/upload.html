<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RaspReader</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <div class="card">
        <h1>📚 RaspReader</h1>
        <p class="subtitle">Your personal Raspberry Pi ebook library</p>

        <form class="upload-box" action="/upload" method="POST" enctype="multipart/form-data">
            <input type="file" name="book" accept=".epub" required>
            <button type="submit">Upload Book</button>
        </form>
            
        {% if error %}
        <div class="message error">
            {{ error }}
        </div>
        {% endif %}

        <p>DEBUG: {{ error }}</p>
    </div>


    <div class="card">
        <h2>Library</h2>

        <ul>
        {% for book in books %}
            <li>
                <strong>{{ book.title }}</strong><br>
                <small>by {{ book.author }}</small>
            </li>
        {% else %}
            <li class="empty">No books uploaded yet.</li>
        {% endfor %}
        </ul>
    </div>

</div>

</body>
</html>
