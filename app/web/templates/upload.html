<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RaspReader</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

{% if error %}
<div class="banner banner-error">
    {{ error }}
</div>
{% endif %}

{% if success %}
<div class="banner banner-success">
    {{ success }}
</div>
{% endif %}

<script>
const banner = document.querySelector(".banner");

if (banner) {
    setTimeout(() => {
        banner.style.transition = "opacity 0.5s";
        banner.style.opacity = "0";

        setTimeout(() => banner.remove(), 500);
    }, 3000);
}
</script>

<div class="container">

    <div class="card">
        <h1>📚 RaspReader</h1>
        <p class="subtitle">Your personal Raspberry Pi ebook library</p>

        <form class="upload-box" action="/upload" method="POST" enctype="multipart/form-data">
            <input type="file" name="book" accept=".epub" required>
            <button type="submit">Upload Book</button>
        </form>

    </div>


    <div class="card">
        <h2>Library</h2>

        <ul>
        {% for book in books %}
            <li class="book-item">
                <div class="book-details">
                    <strong>{{ book.title }}</strong>
                    <small>by {{ book.author }}</small>
                </div>
                <div class="book-actions">
                    <form action="{{ url_for('delete_cache', filename=book.path.name) }}" method="POST">
                        <button class="button-secondary" type="submit">Delete cache</button>
                    </form>
                    <form action="{{ url_for('delete_book', filename=book.path.name) }}" method="POST" onsubmit="return confirm('Delete {{ book.title|e }} and its cache?');">
                        <button class="button-danger" type="submit">Delete book</button>
                    </form>
                </div>
            </li>
        {% else %}
            <li class="empty">No books uploaded yet.</li>
        {% endfor %}
        </ul>
    </div>

</div>

</body>
</html>
